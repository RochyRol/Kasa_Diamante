<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <!-- Gold gradient for text/monogram -->
    <linearGradient id="goldText" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%"   stop-color="#5C3A09"/>
      <stop offset="15%"  stop-color="#9A6F10"/>
      <stop offset="30%"  stop-color="#E8C640"/>
      <stop offset="48%"  stop-color="#F5D060"/>
      <stop offset="62%"  stop-color="#D4AF37"/>
      <stop offset="78%"  stop-color="#E8C640"/>
      <stop offset="90%"  stop-color="#9A6F10"/>
      <stop offset="100%" stop-color="#5C3A09"/>
    </linearGradient>
    <!-- Gold gradient for the ring -->
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#3D2508"/>
      <stop offset="12%"  stop-color="#7A5510"/>
      <stop offset="28%"  stop-color="#D4AF37"/>
      <stop offset="42%"  stop-color="#F5D060"/>
      <stop offset="55%"  stop-color="#FFFACC"/>
      <stop offset="65%"  stop-color="#F5D060"/>
      <stop offset="78%"  stop-color="#D4AF37"/>
      <stop offset="90%"  stop-color="#7A5510"/>
      <stop offset="100%" stop-color="#3D2508"/>
    </linearGradient>
    <!-- Subtle inner shadow ring -->
    <linearGradient id="innerShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="50%"  stop-color="#000000" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Black circle background -->
  <circle cx="120" cy="120" r="118" fill="#050505"/>

  <!-- Ring: deep shadow layer -->
  <circle cx="120" cy="120" r="110" fill="none" stroke="#2A1A05" stroke-width="18"/>
  <!-- Ring: main gold gradient -->
  <circle cx="120" cy="120" r="110" fill="none" stroke="url(#goldRing)" stroke-width="11"/>
  <!-- Ring: inner highlight -->
  <circle cx="120" cy="120" r="105" fill="none" stroke="rgba(255,250,200,0.18)" stroke-width="1.2"/>
  <!-- Ring: outer highlight -->
  <circle cx="120" cy="120" r="115" fill="none" stroke="rgba(255,240,100,0.10)" stroke-width="1"/>

  <!-- K — large display serif -->
  <text
    x="26"
    y="132"
    font-family="'Bodoni MT', 'Didot', 'Book Antiqua', 'Palatino Linotype', Georgia, serif"
    font-size="90"
    font-weight="400"
    font-style="normal"
    fill="url(#goldText)"
    letter-spacing="-2">K</text>

  <!-- D — smaller, raised (monogram style) -->
  <text
    x="99"
    y="116"
    font-family="'Bodoni MT', 'Didot', 'Book Antiqua', 'Palatino Linotype', Georgia, serif"
    font-size="56"
    font-weight="400"
    font-style="normal"
    fill="url(#goldText)">D</text>

  <!-- KASA DIAMANTE — small caps label -->
  <text
    x="120"
    y="157"
    font-family="'Bodoni MT', 'Didot', 'Book Antiqua', 'Palatino Linotype', Georgia, serif"
    font-size="11"
    font-weight="400"
    letter-spacing="4.8"
    text-anchor="middle"
    fill="url(#goldText)">KASA DIAMANTE</text>
</svg>
